services:
  appd-proxy:
    image: appdynamics/php-proxy-x64:25.10.0
    platform: linux/amd64
    command: >
      /bin/sh -c 'mkdir -p /tmp/appd/run && mkdir -p /tmp/appd/logs && ./proxy/runProxy -v /tmp/appd/run /tmp/appd/logs \
      -Dappdynamics.proxy.commtcphost="$${APPDYNAMICS_TCP_COMM_HOST}" \
      -Dcommtcp="$${APPDYNAMICS_TCP_COMM_PORT}" \
      -Dappdynamics.proxy.commportrange="$${APPDYNAMICS_TCP_PORT_RANGE}" \
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME: "<VALUE>"
      APPDYNAMICS_CONTROLLER_PORT: "<VALUE>"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_NAME: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "<VALUE>"
      APPDYNAMICS_TCP_COMM_HOST: "0.0.0.0"
      APPDYNAMICS_TCP_COMM_PORT: "3000"
      APPDYNAMICS_TCP_PORT_RANGE: "3001-3100"
      APPDYNAMICS_MIN_HEAP_SIZE: "256m"
      APPDYNAMICS_MAX_HEAP_SIZE: "512m"
    networks:
      - webapp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL","pgrep java >/dev/null"
        ]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 15s

  web:
    build:
      context: app
      target: builder
    ports: 
      - '8080:80'
    command: /bin/bash /opt/appdynamics/run-with-appd-php-agent.sh
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME: "<VALUE>"
      APPDYNAMICS_CONTROLLER_PORT: "<VALUE>"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_NAME: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "<VALUE>"
      APPDYNAMICS_AGENT_APPLICATION_NAME: "php-shared-agent1-app"
      APPDYNAMICS_AGENT_TIER_NAME: "tier1"
      APPDYNAMICS_AGENT_NODE_NAME: "node1"
      APPDYNAMICS_AGENT_NODE_REUSE: "true"
      APPDYNAMICS_AGENT_PROXY_AUTO_LAUNCH: "0"
      APPDYNAMICS_TCP_COMM_HOST: "appd-proxy"
      APPDYNAMICS_TCP_COMM_PORT: "3000"
      APPDYNAMICS_TCP_PORT_RANGE: "3001-3100"
      APPDYNAMICS_PHP_INI_LOCATION: "/usr/local/etc/php/conf.d" # /usr/local/etc/php/conf.d/appdynamics_agent.ini
      APP_ENTRY_POINT: "apache2-foreground"

    volumes:
      - ./app:/var/www/html/
      - ./appdynamics-php-agent-linux_x64:/opt/appdynamics/php-agent
      - ./run-with-appd-php-agent.sh:/opt/appdynamics/run-with-appd-php-agent.sh
    networks:
      - webapp

    depends_on:
      appd-proxy:
        condition: service_healthy
  webnew:
    build:
      context: app
      target: builder
    ports: 
      - '8081:80'
    command: /bin/bash /opt/appdynamics/run-with-appd-php-agent.sh
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME: "<VALUE>"
      APPDYNAMICS_CONTROLLER_PORT: "<VALUE>"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_NAME: "<VALUE>"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "<VALUE>"
      APPDYNAMICS_AGENT_APPLICATION_NAME: "php-shared-agent2-app"
      APPDYNAMICS_AGENT_TIER_NAME: "tier1"
      APPDYNAMICS_AGENT_NODE_NAME: "node1"
      APPDYNAMICS_AGENT_NODE_REUSE: "true"
      APPDYNAMICS_AGENT_PROXY_AUTO_LAUNCH: "0"
      APPDYNAMICS_TCP_COMM_HOST: "appd-proxy"
      APPDYNAMICS_TCP_COMM_PORT: "3000"
      APPDYNAMICS_TCP_PORT_RANGE: "3001-3100"
      APPDYNAMICS_PHP_INI_LOCATION: "/usr/local/etc/php/conf.d" # /usr/local/etc/php/conf.d/appdynamics_agent.ini
      APP_ENTRY_POINT: "apache2-foreground"

    volumes:
      - ./app:/var/www/html/
      - ./appdynamics-php-agent-linux_x64:/opt/appdynamics/php-agent
      - ./run-with-appd-php-agent.sh:/opt/appdynamics/run-with-appd-php-agent.sh
    networks:
      - webapp

    depends_on:
      appd-proxy:
        condition: service_healthy
networks:
  webapp:
